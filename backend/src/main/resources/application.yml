server:
  port: 8081

spring:
  application:
    name: tuition-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/tuition_db
    username: postgres
    password: Mayur@06
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-please-change-in-production-1234567890}
  expiration-ms: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  # Sample website content (courses, faculty, toppers, results, announcements, gallery).
  #   if-empty : add sample data only to empty sections (default, safe)
  #   reset    : delete ALL website content + enquiries and load fresh sample data
  #              (run once to clear old test entries, then set back to if-empty)
  #   off      : never add sample data
  demo-data: ${DEMO_DATA:if-empty}
