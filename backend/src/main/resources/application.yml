server:
  port: 8081

spring:
  application:
    name: tuition-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/tuition_db
    username: postgres
    password: Mayur@06
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-please-change-in-production-1234567890}
  expiration-ms: 86400000

cors:
  allowed-origins: http://localhost:5173

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
